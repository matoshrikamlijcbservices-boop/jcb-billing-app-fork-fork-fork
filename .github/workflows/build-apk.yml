name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with: {node-version: 22}
      
    - uses: actions/setup-java@v4
      with: {distribution: 'zulu', java-version: '21'}
      
    - uses: pnpm/action-setup@v3
      with: {version: 9}
      
    - name: Install Project Dependencies
      run: |
        cd src/frontend
        pnpm install
      
    - name: Build Frontend Web Assets
      run: |
        cd src/frontend
        pnpm build
      
    - name: Setup Capacitor and Android Native Plugins
      run: |
        cd src/frontend
        pnpm add @capacitor/core @capacitor/cli @capacitor/android
        pnpm add @capacitor/browser @capacitor/filesystem @capacitor/preferences
        npx cap init "JCB Billing" "com.jcbbilling.app" --web-dir=dist
        npx cap add android
        npx cap sync android
        
    - name: Compile Debug APK
      run: |
        cd src/frontend/android
        ./gradlew assembleDebug
      
    - name: Upload APK Package
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: src/frontend/android/app/build/outputs/apk/debug/app-debug.apk
